# social-autopub 自托管生产编排
# 用法：
#   1) 复制本文件旁生成 .env（参考仓库根 .env.example），填好所有 ${...} 引用的变量
#   2) docker compose up -d --build
#   3) 前置反向代理：仅把 console 暴露为公网入口（console=3001，api 只走 Docker 内网）
# 若使用 Postiz OAuth webhook，再按下方示例只放行对应 api 路径
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      POSTGRES_DB: social_autopub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_autopub"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # 开启 AOF 持久化：配合任务补偿逻辑，尽量降低队列任务丢失
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://social:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/social_autopub
      REDIS_URL: redis://redis:6379
      NOTION_TOKEN: ${NOTION_TOKEN}
      WIKIFX_ARTICLES_API_KEY: ${WIKIFX_ARTICLES_API_KEY:-}
      WIKIFX_ARTICLES_API_URL: ${WIKIFX_ARTICLES_API_URL:-https://articles-api.chouai.cc.cd/api/v1/public/wikifx/articles/top}
      WIKIFX_ALLOW_CUSTOM_URL: ${WIKIFX_ALLOW_CUSTOM_URL:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GENERATION_MODEL: ${GENERATION_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_REASONING_MAX_TOKENS: ${OPENROUTER_REASONING_MAX_TOKENS:-1000}
      POSTIZ_API_URL: ${POSTIZ_API_URL}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY}
      POSTIZ_JWT_SECRET: ${POSTIZ_JWT_SECRET}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      INGEST_API_KEYS: ${INGEST_API_KEYS}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DRY_RUN: ${DRY_RUN:-true}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      CONSOLE_URL: ${CONSOLE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ---- 内网模式：api 不给宿主机/公网暴露任何端口，只存在于 Docker 内网 -----
    # console 经 API_INTERNAL_URL=http://api:3000 走内网关调；如确需外部使用
    # /v1/ingest 或 Postiz OAuth webhook，由下方 Caddy/client 反向代理按路径放行。
    # 诊断用快速临时暴露：换行改成  ports: ["127.0.0.1:${API_PORT:-3000}:3000"]

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_INTERNAL_URL: http://api:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
    depends_on:
      api:
        condition: service_healthy
    # 只绑宿主回环口，供宿主反代访问，勿直接 0.0.0.0 暴露公网
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3001}:3001"

  # 唯一公网入口：反代对外（需开放 80/443）。数据流 浏览器→console→(内网)→api。
  # api 不走公网；仅当要用 HTTP ingest 或 Postiz OAuth 回拨时，才在如下 Caddyfile 里显式放行对应路径：
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddydata:/data
  #   depends_on: [api, console]
  #   # Caddyfile 示例：
  #   #   console.example.com { reverse_proxy console:3001 }            # 运营控制台（唯一对外页面）
  #   #   api.example.com {
  #   #     # 默认全部内网；按需只放行这两条路径
  #   #     handle POST /v1/ingest { reverse_proxy api:3000 }
  #   #     handle /v1/postiz-oauth/webhook { reverse_proxy api:3000 }
  #   #     respond 404
  #   #   }

volumes:
  pgdata:
  redisdata:
  # caddydata:
